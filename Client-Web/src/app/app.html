<div class="min-h-screen bg-surface-50 text-surface-900">
  <header
    class="flex items-center justify-between gap-4 border-b border-surface-200 bg-surface-0 px-6 py-3"
  >
    <div class="flex items-center gap-6">
      <a routerLink="/" class="text-lg font-bold">Meshtrail</a>
      <nav class="flex gap-4" aria-label="Main">
        <a routerLink="/samples" routerLinkActive="font-semibold text-primary">Samples</a>
      </nav>
    </div>
    <p-tag
      [value]="realtimeStatus() === 'connected' ? 'Live' : 'Offline'"
      [severity]="realtimeStatus() === 'connected' ? 'success' : 'secondary'"
    />
  </header>
  <main class="p-6">
    <router-outlet />
  </main>
</div>
